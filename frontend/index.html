<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Конструктор профилей соответствия (XCCDF/OVAL)</title>
<link rel="stylesheet" href="/static/style.css" />
<script>
  // Применяем сохранённые тему и язык до отрисовки страницы, чтобы избежать
  // "мигания" не той темой и не тем языком при загрузке.
  // По умолчанию: тема — светлая, язык — русский.
  (function () {
    try {
      var theme = localStorage.getItem("cpb-theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
      var lang = localStorage.getItem("cpb-lang") || "ru";
      document.documentElement.setAttribute("lang", lang);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">&#9702;</span>
      <div>
        <div class="brand-title" data-i18n="brand-title">Конструктор профилей</div>
        <div class="brand-sub">XCCDF / OVAL</div>
      </div>
      <div class="brand-actions">
        <button class="btn-icon lang-toggle" id="btn-lang-toggle" title="Сменить язык / Switch language">RU</button>
        <button class="btn-icon theme-toggle" id="btn-theme-toggle" title="Переключить тему / Switch theme">☾</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-head">
        <span data-i18n="sidebar-projects">Проекты</span>
        <button class="btn-icon" id="btn-new-project" title="Новый проект">+</button>
      </div>
      <div id="project-list" class="project-list"></div>
      <div class="sidebar-hint">
        <label class="import-label" for="import-file" data-i18n="sidebar-import">Импорт ZIP…</label>
        <input type="file" id="import-file" accept=".zip" hidden />
      </div>
    </div>
  </aside>

  <main class="main">
    <div id="view-root"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="/static/i18n.js"></script>
<script src="/static/api.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
